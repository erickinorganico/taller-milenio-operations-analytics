name: Taller en la nube
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fotos-desde-celular:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preparar navegador de prueba aislado
        run: |
          python -m pip install -r requirements-web.txt playwright==1.64.1
          python -m playwright install --with-deps --only-shell chromium
      - name: Tomar foto, recuperar conexión y consultar desde recepción
        run: python infra/nube/tests/fotos_navegador.py --app-python "$(command -v python)"
  instalacion-y-recuperacion:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Herramientas de recuperación
        run: sudo apt-get update -qq && sudo apt-get install -y restic
      - name: Instalación inicial, reanudación y actualización
        run: docker run --rm --network none -e MILENIO_TEST_DEPLOY=isolated -v "$PWD/infra/nube:/fixture:ro" python:3.12-slim-bookworm@sha256:44cf1793efa7c7a476bb0f2cff81443f4a072c90c1cb127e2924933daa3e8c64 bash /fixture/tests/deploy-fixture.sh
      - name: HTTPS con orden, dos sesiones, foto y reinicio
        if: ${{ !cancelled() }}
        run: python3 scripts/verify_cloud_https.py --receipt "$RUNNER_TEMP/nube-https.json"
      - name: Respaldo cifrado y restauración en otro directorio
        if: ${{ !cancelled() }}
        run: sudo env MILENIO_DISPOSABLE_LINUX_RUNNER=1 bash infra/nube/backup/test-roundtrip.sh
      - name: Traslado de respaldo Windows con cobros y foto
        if: ${{ !cancelled() }}
        run: sudo env MILENIO_DISPOSABLE_LINUX_RUNNER=1 bash infra/nube/tests/portable-roundtrip.sh
      - uses: actions/upload-artifact@v4
        with:
          name: verificacion-https-sintetica
          path: ${{ runner.temp }}/nube-https.json
