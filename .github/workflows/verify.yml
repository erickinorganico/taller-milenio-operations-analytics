name: Verify synthetic analytics
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned plotting dependencies
        run: python -m pip install -r requirements.txt
      - name: Tests, dependency check and publication hygiene
        run: python -m milenio verify --output artifacts/verification.json
      - name: Complete synthetic batch
        run: python -m milenio demo --output artifacts/ci-demo
      - name: Verify artifact integrity
        run: python -m milenio verify-receipt --input artifacts/ci-demo
      - name: Reanalyze complete CSV export
        run: python -m milenio analyze --input artifacts/ci-demo/csv --output artifacts/ci-csv
      - name: Verify CSV artifact integrity
        run: python -m milenio verify-receipt --input artifacts/ci-csv
      - name: Build V2 studio with deterministic governed rules
        run: python -m milenio studio --output artifacts/ci-studio
      - name: Verify V2 studio receipt
        run: python -m milenio verify-studio --input artifacts/ci-studio
      - name: Verify published V2 delivery
        if: ${{ hashFiles('artifacts/workbench-v2/receipt.json') != '' }}
        run: python -m milenio verify-studio --input artifacts/workbench-v2
      - name: Build client two-week journey
        run: python scripts/build_client_demo.py --output artifacts/ci-client
      - name: Verify first client snapshot
        run: python -m milenio client-verify --input artifacts/ci-client/semana_01
      - name: Verify published client delivery
        run: python -m milenio client-verify --input examples/client_delivery/semana_01
      - name: Verify published sample
        run: python -m milenio verify-receipt --input artifacts/demo
      - name: Expected negative control
        run: python -m milenio controlled-failure --output artifacts/ci-negative
      - name: Preserve receipts and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: milenio-evidence-${{ matrix.os }}
          path: artifacts/
          retention-days: 14
