<form class="analytics-toolbar" id="analytics-filters" method="get" aria-label="Filtros del dashboard"><div class="analytics-range" aria-label="Periodos rápidos">{% for range in quick_ranges %}<a href="{{ range.url }}" class="range-chip {% if range.active %}is-active{% endif %}" {% if range.active %}aria-current="true"{% endif %}>{{ range.label }}</a>{% endfor %}</div><div class="analytics-filter-fields"><div class="field"><label for="start">Desde</label><input id="start" type="date" name="start" value="{{ d.filters.start }}" required></div><div class="field"><label for="end">Hasta</label><input id="end" type="date" name="end" value="{{ d.filters.end }}" required></div><div class="field"><label for="segment">Cliente</label><select id="segment" name="segment"><option value="all" {% if d.filters.segment == 'all' %}selected{% endif %}>Todos</option><option value="individual" {% if d.filters.segment == 'individual' %}selected{% endif %}>Particulares</option><option value="fleet" {% if d.filters.segment == 'fleet' %}selected{% endif %}>Flotillas</option></select></div><div class="field"><label for="snapshot">Corte</label><select id="snapshot" name="snapshot"><option value="">Más reciente</option>{% for cut in snapshots %}<option value="{{ cut.pk }}" {% if request.GET.snapshot == cut.pk|stringformat:'s' %}selected{% endif %}>#{{ cut.pk }} · {{ cut.recorded_at|date:'d M H:i' }}</option>{% endfor %}</select></div><button class="button" type="submit">Aplicar</button></div></form>
